let current;

function load(){
document.getElementById("repoBtn").style.display="none";

document.getElementById("yellow").style.display="none";
document.getElementById("result").style.display="none";

current = questions[Math.floor(Math.random()*questions.length)];

document.getElementById("q").innerText=current.q;

let answers=document.getElementById("answers");
answers.innerHTML="";

let textarea=document.getElementById("studentJust");

// ===== VERDADERO / FALSO =====
if(current.type==="vf"){

textarea.style.display="block";

answers.innerHTML=`
<button onclick="check(true)">VERDADERO</button>
<button onclick="check(false)">FALSO</button>
`;

}

// ===== OPCIONES =====
if(current.type==="opciones"){

textarea.style.display="none";

current.a.forEach((op,i)=>{
answers.innerHTML+=`<button onclick="check(${i})">${op}</button>`;
});

}

}

function check(val){

let result=document.getElementById("result");
result.style.display="block";

// VF
if(current.type==="vf"){

if(val===current.c){

result.className="correct";
result.innerHTML="CORRECTO";

setTimeout(load,1000);

}else{

result.className="wrong";
result.innerHTML="INCORRECTO<br>Respuesta correcta: "+(current.c?"VERDADERO":"FALSO");

}

}

// OPCIONES
if(current.type==="opciones"){

if(val===current.c){

result.className="correct";
result.innerHTML=" CORRECTO";

setTimeout(load,1000);

}else{

result.className="wrong";
result.innerHTML="INCORRECTO<br>Respuesta correcta:<br>"+current.a[current.c];

}

}

}

function showJust(){

document.getElementById("repoBtn").style.display="block";
document.getElementById("yellow").style.display="block";

let just = current.j ? current.j : "";

document.getElementById("yellow").innerHTML =
"<b>Respuesta correcta:</b> "+
(current.type==="vf" ? (current.c?"VERDADERO":"FALSO") : current.a[current.c])+
"<br><br>"+ just;

}
