current.a.forEach((x,i)=>{
html+=`<button onclick="check(${i})">${x}</button>`;
});

document.getElementById("answers").innerHTML=html;
}

function check(i){
if(i===current.c){
document.getElementById("result").innerHTML="✅ CORRECTO";
setTimeout(load,800);
}else{
document.getElementById("result").innerHTML="❌ FAIL<br>Respuesta correcta: "+current.a[current.c];
}
}
