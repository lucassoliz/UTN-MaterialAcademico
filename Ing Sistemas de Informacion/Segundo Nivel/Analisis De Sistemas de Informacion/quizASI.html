<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASI · Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --accent: #7c6aff;
    --accent2: #ff6a9d;
    --green: #3effa3;
    --red: #ff4e6a;
    --yellow: #ffd166;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --mono: 'Space Mono', monospace;
    --sans: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    position: relative;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,106,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,106,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orbs */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(124,106,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .orb2 {
    position: fixed;
    bottom: -200px;
    right: -200px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,106,157,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .logo span {
    color: var(--accent);
  }

  .repo-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 4px;
    transition: all 0.2s;
    letter-spacing: 0.1em;
  }

  .repo-link:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(124,106,255,0.08);
  }

  /* ── STATS BAR ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }

  .stat-val {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-val.green { color: var(--green); }
  .stat-val.red   { color: var(--red); }
  .stat-val.yellow{ color: var(--yellow); }
  .stat-val.purple{ color: var(--accent); }

  .stat-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: var(--mono);
  }

  /* ── STREAK ── */
  .streak-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-height: 42px;
    transition: all 0.3s;
  }

  .streak-bar.active {
    border-color: var(--yellow);
    background: rgba(255,209,102,0.05);
    color: var(--yellow);
  }

  .streak-emoji { font-size: 18px; }

  /* ── FILTER ── */
  .filter-wrap {
    margin-bottom: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
    margin-right: 2px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.05em;
  }

  .tag:hover { border-color: var(--accent); color: var(--accent); }

  .tag.active {
    background: rgba(124,106,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ── CARD ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.35s cubic-bezier(0.22,1,0.36,1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 16px 16px 0 0;
  }

  .card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .type-badge {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid;
  }

  .type-badge.vf        { color: var(--accent);  border-color: rgba(124,106,255,0.4); background: rgba(124,106,255,0.08); }
  .type-badge.opciones  { color: var(--yellow);  border-color: rgba(255,209,102,0.4); background: rgba(255,209,102,0.08); }
  .type-badge.completar { color: var(--green);   border-color: rgba(62,255,163,0.4);  background: rgba(62,255,163,0.08); }

  .topic-badge {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .question {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 28px;
    letter-spacing: -0.01em;
  }

  /* ── BUTTONS ── */
  .answers { display: flex; flex-direction: column; gap: 10px; }

  .ans-btn {
    width: 100%;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 600;
    text-align: left;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }

  .ans-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.18s;
  }

  .ans-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateX(4px);
  }

  .ans-btn .btn-letter {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    min-width: 18px;
    transition: color 0.18s;
  }

  .ans-btn:hover .btn-letter { color: var(--accent); }

  .ans-btn.correct {
    background: rgba(62,255,163,0.1);
    border-color: var(--green);
    color: var(--green);
    transform: none;
  }

  .ans-btn.wrong {
    background: rgba(255,78,106,0.1);
    border-color: var(--red);
    color: var(--red);
    transform: none;
  }

  .ans-btn.correct .btn-letter,
  .ans-btn.wrong .btn-letter { color: inherit; }

  .ans-btn:disabled { cursor: default; }

  /* VF special */
  .vf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .vf-btn {
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-align: center;
    transition: all 0.18s;
  }

  .vf-btn.v:hover:not(:disabled) { border-color: var(--green); color: var(--green); background: rgba(62,255,163,0.05); }
  .vf-btn.f:hover:not(:disabled) { border-color: var(--red);   color: var(--red);   background: rgba(255,78,106,0.05); }

  .vf-btn.correct {
    background: rgba(62,255,163,0.1);
    border-color: var(--green);
    color: var(--green);
  }

  .vf-btn.wrong {
    background: rgba(255,78,106,0.1);
    border-color: var(--red);
    color: var(--red);
  }

  .vf-btn:disabled { cursor: default; }

  /* Completar */
  .completar-wrap { display: flex; flex-direction: column; gap: 12px; }

  .completar-input {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s;
  }

  .completar-input:focus { border-color: var(--accent); }

  .completar-input.correct { border-color: var(--green); background: rgba(62,255,163,0.06); color: var(--green); }
  .completar-input.wrong   { border-color: var(--red);   background: rgba(255,78,106,0.06);  color: var(--red); }

  .submit-btn {
    padding: 13px 24px;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: white;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.18s;
    text-transform: uppercase;
  }

  .submit-btn:hover { background: #9585ff; transform: translateY(-1px); }

  /* ── FEEDBACK ── */
  .feedback {
    margin-top: 20px;
    border-radius: 10px;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    animation: fadeUp 0.25s ease;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .feedback.correct {
    background: rgba(62,255,163,0.08);
    border: 1px solid rgba(62,255,163,0.3);
    color: var(--green);
  }

  .feedback.wrong {
    background: rgba(255,78,106,0.08);
    border: 1px solid rgba(255,78,106,0.3);
    color: var(--red);
  }

  .feedback strong {
    display: block;
    margin-bottom: 6px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.8;
  }

  .feedback .justif {
    color: var(--text);
    opacity: 0.85;
    font-size: 13px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  /* ── BOTTOM CONTROLS ── */
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    padding: 11px 20px;
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.18s;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
  }

  .ctrl-btn:hover { border-color: var(--text); color: var(--text); }

  .ctrl-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .ctrl-btn.primary:hover { background: #9585ff; }

  /* PROGRESS  */
  .progress-ring {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .ring-wrap {
    position: relative;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
  }

  .ring-wrap svg { transform: rotate(-90deg); }

  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
  }

  .ring-info {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .ring-info span { color: var(--text); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 24px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    letter-spacing: 0.05em;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(0.22,1,0.36,1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* ── JUSTIFICATION TEXTAREA ── */
  .just-area {
    width: 100%;
    margin-top: 14px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    resize: vertical;
    min-height: 70px;
    outline: none;
    transition: border-color 0.2s;
  }

  .just-area:focus { border-color: var(--accent); }

  .just-area::placeholder { color: var(--muted); }

  @media (max-width: 520px) {
    .card { padding: 22px 18px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .question { font-size: 16px; }
    .vf-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>

</div>

// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
let current       = null;
let activeTopic   = 'all';
let pool          = [];
let usedIndices   = [];
let stats         = { total:0, correct:0, wrong:0 };
let streak        = 0;
let bestStreak    = 0;
let answered      = false;

// ═══════════════════════════════════════════════
//  TOPIC FILTER
// ═══════════════════════════════════════════════
function setTopic(el) {
  document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  activeTopic = el.dataset.topic;
  document.getElementById('filterInfo').textContent = activeTopic === 'all' ? 'Todos' : activeTopic;
  usedIndices = [];
  load();
}

function getPool() {
  return activeTopic === 'all'
    ? questions
    : questions.filter(q => q.topic === activeTopic);
}

// ═══════════════════════════════════════════════
//  LOAD
// ═══════════════════════════════════════════════
function load() {
  answered = false;
  pool = getPool();
  if (!pool.length) return;

  // anti-repeat
  if (usedIndices.length >= pool.length) usedIndices = [];

  let idx;
  do { idx = Math.floor(Math.random() * pool.length); }
  while (usedIndices.includes(idx));
  usedIndices.push(idx);
  current = pool[idx];

  // reset card
  document.getElementById('q').textContent = current.q;
  document.getElementById('justArea').value = '';
  document.getElementById('justArea').style.display = current.type === 'vf' ? 'block' : 'none';
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';

  // type badge
  const badge = document.getElementById('typeBadge');
  const labels = { vf:'V / F', opciones:'Opción múltiple', completar:'Completar' };
  badge.textContent = labels[current.type];
  badge.className = 'type-badge ' + current.type;

  document.getElementById('topicBadge').textContent = current.topic || '—';

  // re-render card for animation
  const card = document.getElementById('card');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = '';

  renderAnswers();
  updateCounter();
}

// ═══════════════════════════════════════════════
//  RENDER ANSWERS
// ═══════════════════════════════════════════════
const LETTERS = ['A','B','C','D','E'];

function renderAnswers() {
  const wrap = document.getElementById('answers');
  wrap.innerHTML = '';

  if (current.type === 'vf') {
    const row = document.createElement('div');
    row.className = 'vf-row';
    ['VERDADERO','FALSO'].forEach((label, i) => {
      const btn = document.createElement('button');
      btn.className = 'vf-btn ' + (i===0?'v':'f');
      btn.id = 'vf-btn-' + i;
      btn.textContent = label;
      btn.onclick = () => check(i===0 ? true : false, btn);
      row.appendChild(btn);
    });
    wrap.appendChild(row);

  } else if (current.type === 'opciones') {
    current.a.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'ans-btn';
      btn.id = 'opt-btn-' + i;
      btn.innerHTML = `<span class="btn-letter">${LETTERS[i]}</span>${opt}`;
      btn.onclick = () => check(i, btn);
      wrap.appendChild(btn);
    });

  } else if (current.type === 'completar') {
    const div = document.createElement('div');
    div.className = 'completar-wrap';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.className = 'completar-input';
    inp.id = 'completar-inp';
    inp.placeholder = 'Escribí tu respuesta...';
    inp.onkeydown = e => { if(e.key==='Enter') checkCompletar(); };
    const btn = document.createElement('button');
    btn.className = 'submit-btn';
    btn.textContent = 'VERIFICAR';
    btn.onclick = checkCompletar;
    div.appendChild(inp);
    div.appendChild(btn);
    wrap.appendChild(div);
    setTimeout(()=>inp.focus(), 50);
  }
}

// ═══════════════════════════════════════════════
//  CHECK
// ═══════════════════════════════════════════════
function check(val, clickedBtn) {
  if (answered) return;
  answered = true;

  const isCorrect = val === current.c;
  registerResult(isCorrect);

  // Disable all buttons
  document.querySelectorAll('.vf-btn, .ans-btn').forEach(b => b.disabled = true);

  if (current.type === 'vf') {
    const vBtn = document.getElementById('vf-btn-0');
    const fBtn = document.getElementById('vf-btn-1');
    if (current.c === true) {
      vBtn.classList.add('correct');
      if (!isCorrect) fBtn.classList.add('wrong');
    } else {
      fBtn.classList.add('correct');
      if (!isCorrect) vBtn.classList.add('wrong');
    }
  } else {
    document.getElementById('opt-btn-' + current.c).classList.add('correct');
    if (!isCorrect) clickedBtn.classList.add('wrong');
  }

  showFeedback(isCorrect);
  if (isCorrect) setTimeout(load, 1500);
}

function checkCompletar() {
  if (answered) return;
  answered = true;

  const inp = document.getElementById('completar-inp');
  const userAns = inp.value.trim().toLowerCase();
  const correctAns = current.r.toLowerCase();
  const isCorrect = userAns === correctAns ||
                    correctAns.includes(userAns) ||
                    userAns.includes(correctAns.split(' ')[0]);

  inp.disabled = true;
  inp.classList.add(isCorrect ? 'correct' : 'wrong');
  registerResult(isCorrect);
  showFeedback(isCorrect);
  if (isCorrect) setTimeout(load, 1800);
}


//   fFEEDBACK
function showFeedback(isCorrect) {
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');

  let correctLabel = '';
  if (current.type === 'vf') correctLabel = current.c ? 'VERDADERO' : 'FALSO';
  else if (current.type === 'opciones') correctLabel = current.a[current.c];
  else if (current.type === 'completar') correctLabel = current.r;

  const justif = current.j || current.r || '';
  fb.innerHTML = `<strong>${isCorrect ? '✓ CORRECTO' : '✗ INCORRECTO'}</strong>
    Respuesta: ${correctLabel}
    ${justif ? `<div class="justif">${justif}</div>` : ''}`;
}

function showJust() {
  if (!current) return;
  showFeedback(false); 

  if (!answered) {
    const fb = document.getElementById('feedback');
    fb.className = 'feedback wrong';
    fb.style.background = 'rgba(124,106,255,0.08)';
    fb.style.borderColor = 'rgba(124,106,255,0.3)';
    fb.style.color = 'var(--text)';
  }
}

function registerResult(isCorrect) {
  stats.total++;
  if (isCorrect) { stats.correct++; streak++; if(streak>bestStreak) bestStreak=streak; }
  else           { stats.wrong++;   streak=0; }
  updateStats();
  updateStreak();
}

function updateStats() {
  document.getElementById('s-total').textContent   = stats.total;
  document.getElementById('s-correct').textContent = stats.correct;
  document.getElementById('s-wrong').textContent   = stats.wrong;
  const pct = stats.total ? Math.round(stats.correct/stats.total*100) : null;
  const pctEl = document.getElementById('s-pct');
  pctEl.textContent = pct !== null ? pct+'%' : '—';

  const circ = 106.8;
  const offset = pct !== null ? circ - (pct/100)*circ : circ;
  document.getElementById('ringCircle').style.strokeDashoffset = offset;
  document.getElementById('ringPct').textContent = pct !== null ? pct+'%' : '0%';
}

function updateStreak() {
  const bar  = document.getElementById('streakBar');
  const text = document.getElementById('streakText');
  if (streak === 0) {
    bar.classList.remove('active');
    text.textContent = 'Racha rota. ¡A recuperarla!';
    bar.querySelector('.streak-emoji').textContent = '💤';
  } else {
    bar.classList.add('active');
    const emoji = streak >= 10 ? '🔥🔥🔥' : streak >= 5 ? '🔥🔥' : '🔥';
    bar.querySelector('.streak-emoji').textContent = emoji;
    text.textContent = `Racha: ${streak} correctas seguidas · Mejor: ${bestStreak}`;
  }
}

function updateCounter() {
  document.getElementById('qCount').textContent = usedIndices.length;
}

function resetStats() {
  stats = { total:0, correct:0, wrong:0 };
  streak = 0; bestStreak = 0;
  updateStats();
  updateStreak();
  toast('Stats reiniciadas ✓');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

load();
</script>
